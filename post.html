<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar pessoa</title>

    <style>
        :root{
            --green:#28a745;
            --green-dark:#24963b;
            --muted:#6b7280;
            --bg:#f3f4f6;
        }
        html,body{height:100%}
        body{
            margin:0;
            font-family: system-ui,-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background:var(--bg);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        main{
            width:100%;
            max-width:520px;
            background:#fff;
            border-radius:10px;
            box-shadow:0 6px 20px rgba(12,17,25,0.06);
            padding:20px;
            box-sizing:border-box;
        }
        h1{
            margin:0 0 12px;
            font-size:1.1rem;
        }
        .form-grid{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:12px;
        }
        .full{ grid-column: 1 / -1; }
        label{
            display:block;
            font-weight:600;
            font-size:0.95rem;
            margin-bottom:6px;
        }
        input[type="text"], input[type="number"], input[type="url"]{
            width:100%;
            padding:10px 12px;
            border:1px solid #e6e7eb;
            border-radius:8px;
            font-size:1rem;
            box-sizing:border-box;
        }
        input::placeholder{ color:#9ca3af; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
        .helper{ font-size:0.85rem; color:var(--muted); margin-top:6px; }
        .button{
            background:var(--green);
            color:#fff;
            border:none;
            padding:12px 14px;
            border-radius:8px;
            font-weight:700;
            cursor:pointer;
            width:100%;
            box-shadow:0 2px 6px rgba(39,174,96,0.12);
        }
        .button:hover{ background:var(--green-dark); }
        #postMessage{ margin-top:10px; min-height:20px; font-size:0.95rem; color:var(--muted); }
        @media (max-width:560px){
            .form-grid{ grid-template-columns:1fr; }
            .button{ padding:12px; }
        }
    </style>
</head>
<body>
    <main>
        <form id="postForm" onsubmit="post_person(); return false;" novalidate>
            <label for="nome">Nome</label>
            <input id="nome" type="text" required placeholder="Ex: José Maria de Santo Agostinho">

            <label for="foto">URL da foto</label>
            <input id="foto" type="url" placeholder="https://exemplo.com/foto.jpg">

            <label for="nasc">Nascimento</label>
            <input id="nasc" type="number" min="1400" max="2000" placeholder="1900" required>

            <label for="morte">Morte (opcional)</label>
            <input id="morte" type="number" min="1400" max="2000" placeholder="—">

            <div style="margin-top:12px">
                <button id="submitBtn" class="button" type="submit">Enviar</button>
            </div>
            <div id="postMessage" aria-live="polite"></div>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="bd.js"></script>
</body>
</html>
